[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["extensions/zed"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/gz0ni/emu86-ide"
authors = ["gz0ni"]

[workspace.dependencies]
emu86-core = { path = "crates/emu86-core" }
emu86-asm = { path = "crates/emu86-asm" }

[profile.release]
lto = "thin"
